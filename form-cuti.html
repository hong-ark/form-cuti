<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>INPUT NIK SEBELUM REQUEST</title>
  <style>
    :root{ --bg1:#2193b0; --bg2:#6dd5ed; --card:#fff; --muted:#6b7280; --ok:#16a34a; --err:#ef4444;}
    *{box-sizing:border-box}
    body{font-family:Inter, Arial, sans-serif; margin:0; min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,var(--bg1),var(--bg2)); padding:20px;}
    .card{width:100%; max-width:460px; background:var(--card); padding:22px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.12);}
    h1{margin:0 0 12px 0; text-align:center; font-size:18px; font-weight:700;
      background:linear-gradient(90deg,var(--bg1),var(--bg2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
    label{display:block; margin-top:10px; color:#222; font-weight:600; font-size:13px;}
    input[type="text"], input[type="password"]{width:100%; padding:10px 12px; margin-top:8px; border-radius:8px; border:1px solid #e5e7eb; font-size:14px;}
    .btn{display:inline-block; width:100%; padding:11px 12px; margin-top:14px; border-radius:8px; border:none; cursor:pointer; font-weight:700;}
    .btn-primary{background:var(--bg1); color:#fff;}
    .btn-success{background:var(--ok); color:#fff;}
    .link{display:inline-block; margin-top:10px; color:var(--bg1); cursor:pointer; text-decoration:underline;}
    .small{font-size:13px; color:var(--muted); margin-top:8px;}
    .status{min-height:24px; margin-top:12px; font-weight:600;}
    .status.ok{color:var(--ok);} .status.err{color:var(--err);}
    .hidden{display:none;}
    /* modal */
    .modal-backdrop{position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:1000;}
    .modal{width:100%; max-width:420px; background:#fff; border-radius:10px; padding:18px; box-shadow:0 10px 30px rgba(0,0,0,.2);}
    .modal h3{margin:0 0 10px 0; font-size:16px;}
    .inline-btn{display:inline-block; padding:8px 12px; border-radius:8px; border:none; cursor:pointer; font-weight:700;}
    .btn-cancel{background:#6b7280; color:#fff;}
    .btn-save{background:var(--ok); color:#fff;}
    .muted{color:var(--muted); font-size:13px;}
  </style>
</head>
<body>
  <div class="card" role="main" aria-labelledby="judul">
    <h1 id="judul">INPUT NIK SEBELUM REQUEST</h1>

    <label for="nik">Masukkan NIK</label>
    <input id="nik" type="text" inputmode="numeric" placeholder="Contoh: 2012022847" />

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Masukkan password (jika ada, default 123)" />
    <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
      <label style="display:flex;align-items:center;gap:6px;"><input id="showPwd" type="checkbox" /> <span class="small">Tampilkan password</span></label>
    </div>

    <!-- Informasi & link ubah (tidak membuka modal otomatis) -->
    <div class="small muted" style="margin-top:8px;">
      Password default <strong>123</strong>, klik <a id="changeLinkInline" class="link">ubah</a> jika ingin ubah password.
    </div>

    <button id="cekBtn" class="btn btn-primary">Cek &amp; Login</button>

    <div id="status" class="status" aria-live="polite"></div>

    <div class="small muted" style="margin-top:8px;">Catatan: Password disimpan dalam sheet (plain text). Jika ingin hashing, kabari saya.</div>
  </div>

  <!-- Modal: Ubah Password (TERSEMBUNYI pada load) -->
  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Ubah Password</h3>

      <label for="oldPwd">Password Lama</label>
      <input id="oldPwd" type="password" placeholder="Masukkan password lama (mis. 123 jika belum diubah)" />

      <label for="newPwd" style="margin-top:8px;">Password Baru</label>
      <input id="newPwd" type="password" placeholder="Password baru (min 4 karakter)" />

      <label for="confirmNewPwd" class="muted" style="margin-top:8px;">Konfirmasi Password</label>
      <input id="confirmNewPwd" type="password" placeholder="Ketik ulang password baru" />

      <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
        <label style="display:flex;align-items:center;gap:6px;"><input id="showModalPwds" type="checkbox" /> <span class="small">Tampilkan semua password</span></label>
      </div>

      <div style="display:flex; gap:10px; margin-top:12px;">
        <button id="modalCancel" class="inline-btn btn-cancel">Batal</button>
        <button id="modalSave" class="inline-btn btn-save">Simpan Perubahan</button>
      </div>

      <div id="modalStatus" class="muted" style="margin-top:10px; font-weight:700; min-height:22px;"></div>
    </div>
  </div>

  <script>
    // === GANTI DENGAN URL WEB APP ANDA ===
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzUeW__z56sedyh1G8FtgQTOTwYHXliSq3wmh1tAshWOBaLMmc9cpdwJ9Cg_5jILg06/exec";

    // refs
    const nikInput = document.getElementById('nik');
    const pwdInput = document.getElementById('password');
    const showPwd = document.getElementById('showPwd');
    const cekBtn = document.getElementById('cekBtn');
    const statusDiv = document.getElementById('status');
    const changeLinkInline = document.getElementById('changeLinkInline');

    // modal refs
    const modalBackdrop = document.getElementById('modalBackdrop');
    const oldPwd = document.getElementById('oldPwd');
    const newPwd = document.getElementById('newPwd');
    const confirmNewPwd = document.getElementById('confirmNewPwd');
    const showModalPwds = document.getElementById('showModalPwds');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');
    const modalStatus = document.getElementById('modalStatus');

    let lastCheckedNik = "";
    let currentInfo = null;

    function setStatus(text, type=null) {
      statusDiv.textContent = text || "";
      statusDiv.className = 'status' + (type ? ' ' + type : '');
    }
    function show(el){ el.classList.remove('hidden'); el.setAttribute('aria-hidden','false'); }
    function hide(el){ el.classList.add('hidden'); el.setAttribute('aria-hidden','true'); }

    // only toggle password visibility
    showPwd.addEventListener('change', () => {
      pwdInput.type = showPwd.checked ? 'text' : 'password';
    });

    // -------------- Cek NIK (no modal calls here) --------------
    cekBtn.addEventListener('click', async () => {
      const nik = nikInput.value.trim();
      const password = pwdInput.value;
      if (!nik) { setStatus('⚠️ Silakan masukkan NIK.', 'err'); return; }
      setStatus('🔄 Memeriksa NIK...', null);
      lastCheckedNik = nik;
      currentInfo = null;

      try {
        let url = `${GAS_URL}?nik=${encodeURIComponent(nik)}`;
        if (password) url += `&password=${encodeURIComponent(password)}`;
        const resp = await fetch(url);
        if (!resp.ok) { setStatus('❌ Server error: ' + resp.status, 'err'); return; }
        const data = await resp.json();
        if (data.error) { setStatus(data.error, 'err'); return; }

        if (password && data.nama && data.group) {
          setStatus(`✅ Verifikasi sukses. Nama: ${data.nama} | Group: ${data.group}`, 'ok');
          currentInfo = { nama: data.nama, group: data.group, passwordPresent: true };
          return;
        }
        if (data.nama && data.group !== undefined && data.passwordPresent !== undefined) {
          currentInfo = { nama: data.nama, group: data.group, passwordPresent: !!data.passwordPresent };
          setStatus(`✅ Nama: ${data.nama} | Group: ${data.group}`, 'ok');
          return;
        }
        setStatus('❌ Respon server tidak sesuai.', 'err');
      } catch (err) {
        console.error(err);
        setStatus('❌ Gagal menghubungi server. Cek URL & koneksi.', 'err');
      }
    });

    // -------------- Modal open only on click (no auto show) --------------
    changeLinkInline.addEventListener('click', () => {
      if (!lastCheckedNik) { setStatus('⚠️ Silakan cek NIK terlebih dahulu.', 'err'); return; }
      modalStatus.textContent = '';
      oldPwd.value = ''; newPwd.value = ''; confirmNewPwd.value = '';
      show(modalBackdrop);
    });

    // modal controls
    showModalPwds.addEventListener('change', () => {
      const t = showModalPwds.checked ? 'text' : 'password';
      oldPwd.type = t; newPwd.type = t; confirmNewPwd.type = t;
    });
    modalCancel.addEventListener('click', () => hide(modalBackdrop));
    modalBackdrop.addEventListener('click', (ev) => { if (ev.target === modalBackdrop) hide(modalBackdrop); });

    // submit change password (same changePassword POST as before)
    modalSave.addEventListener('click', async () => {
      const nik = lastCheckedNik || nikInput.value.trim();
      const oldP = oldPwd.value;
      const newP = newPwd.value;
      const conf = confirmNewPwd.value;
      if (!nik) { modalStatus.textContent = '⚠️ Silakan cek NIK terlebih dahulu.'; modalStatus.style.color='var(--err)'; return; }
      if (!oldP || !newP || !conf) { modalStatus.textContent='⚠️ Lengkapi semua field.'; modalStatus.style.color='var(--err)'; return; }
      if (newP !== conf) { modalStatus.textContent='⚠️ Konfirmasi password tidak cocok.'; modalStatus.style.color='var(--err)'; return; }
      if (newP.length < 4) { modalStatus.textContent='⚠️ Gunakan minimal 4 karakter untuk password.'; modalStatus.style.color='var(--err)'; return; }
      modalSave.disabled = true; modalSave.textContent = 'Menyimpan...'; modalStatus.textContent='🔄 Mengirim...'; modalStatus.style.color='black';

      try {
        const form = new URLSearchParams();
        form.append('action','changePassword');
        form.append('nik', nik);
        form.append('oldPassword', oldP);
        form.append('newPassword', newP);
        const resp = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'}, body: form.toString() });
        if (!resp.ok) { modalStatus.textContent = '❌ Server error: ' + resp.status; modalStatus.style.color='var(--err)'; return; }
        const data = await resp.json();
        if (data.error) { modalStatus.textContent = data.error; modalStatus.style.color='var(--err)'; return; }
        modalStatus.textContent = data.message || '✅ Password berhasil diubah.'; modalStatus.style.color='var(--ok)';
        setTimeout(()=> hide(modalBackdrop), 900);
      } catch (err) {
        console.error(err);
        modalStatus.textContent = '❌ Gagal menghubungi server.'; modalStatus.style.color='var(--err)';
      } finally {
        modalSave.disabled = false; modalSave.textContent = 'Simpan Perubahan';
      }
    });
  </script>
</body>
</html>
